<script>
(function () {
  var D = {"1": {"par": 3, "len": 63, "info": "Přes terénní zlom, pár stromů v cestě"}, "2": {"par": 3, "len": 66, "info": "Lehce do kopce, koš mezi stromy"}, "3": {"par": 3, "len": 79, "info": "Lehce do kopce mezi stromy, koš na lavičce"}, "4": {"par": 3, "len": 78, "info": "Nízkej strop, pozor na dětskě hříště vlevo!"}, "5": {"par": 3, "len": 72, "info": "Hodně do kopce"}, "6": {"par": 4, "len": 109, "info": "Signature dogleg vpravo"}, "7": {"par": 3, "len": 63, "info": "Prudce z kopce, cesta za košem OB"}, "8": {"par": 3, "len": 72, "info": "Zpátky do kopce"}, "9": {"par": 4, "len": 93, "info": "Dogleg doprava do lesa, sneaky eagle roll okno"}, "10": {"par": 3, "len": 78, "info": "Pár stromů k netrefení"}, "11": {"par": 3, "len": 68, "info": "Výběr ze tří oken a pak pár stromů"}, "12": {"par": 4, "len": 80, "info": "Mando vlevo, bez DZ! dogleg vpravo, koš stojí na ostrohu, pro zájemce #simonline hyzer okno, ale to spotujte!"}, "13": {"par": 4, "len": 126, "info": "!!! POZOR na lidi na cestě, která je hranice OB, vlevo hustý lesík, dogleg vlevo"}, "14": {"par": 3, "len": 102, "info": "Lehce zkopce, koš na kopečku, nechceš bý za ním"}, "15": {"par": 4, "len": 109, "info": "Drive z kopce, prostor fitka vpravo je povinná úleva, hraje se jako OB bez trestné rány, koš na kopečku mezi stromy. Pozor při přechodu na další jamku, zprava může letět drive!"}, "16": {"par": 4, "len": 144, "info": "Signature finská, vpravo podél FW zbytky rezavého drátěného plotu, povolena úleva 2 metry, koš bráněný několika břízkami"}, "17": {"par": 4, "len": 126, "info": "Korýtko, vlevo kopřivy a jiný bordel, vpravo stráň, druhá půlka s nízkým stropem"}, "18": {"par": 3, "len": 68, "info": "Tunel, mimo FW nechceš"}}, keys = Object.keys(D).map(Number).sort(function (a, b) { return a - b; });
  var m = document.getElementById('hm'), cur = null;
  function hl(n) {
    document.querySelectorAll('.fair .hl').forEach(function (e) { e.classList.remove('hl'); });
    if (n) document.querySelectorAll('.fair [data-h="' + n + '"]').forEach(function (e) { e.classList.add('hl'); });
  }
  function show(n) {
    var d = D[n]; if (!d) return; cur = n;
    document.getElementById('hm-n').textContent = n;
    document.getElementById('hm-t').textContent = 'Jamka ' + n;
    document.getElementById('hm-p').textContent = 'PAR ' + d.par;
    document.getElementById('hm-l').textContent = d.len + ' m';
    document.getElementById('hm-i').textContent = d.info;
    m.classList.add('on'); hl(n);
  }
  function hide() { m.classList.remove('on'); hl(null); cur = null; }
  function step(k) { var i = keys.indexOf(cur); show(keys[(i + k + keys.length) % keys.length]); }
  document.querySelector('svg.map').addEventListener('click', function (e) {
    var t = e.target.closest('[data-h]'); if (t) show(+t.getAttribute('data-h'));
  });
  m.addEventListener('click', function (e) { if (e.target === m) hide(); });
  m.querySelector('.x').addEventListener('click', hide);
  document.getElementById('hm-prev').addEventListener('click', function () { step(-1); });
  document.getElementById('hm-next').addEventListener('click', function () { step(1); });
  document.addEventListener('keydown', function (e) {
    if (!m.classList.contains('on')) return;
    if (e.key === 'Escape') hide();
    if (e.key === 'ArrowRight') step(1);
    if (e.key === 'ArrowLeft') step(-1);
  });
})();
</script>
