<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Discgolfové mapy by Kuba Kemr</title>
<meta name="description" content="Mapy discgolfových hřišť a turnajů – jamky, pary, délky a detaily ke každé jamce.">
<meta property="og:title" content="Discgolfové mapy by Kuba Kemr">
<meta property="og:description" content="Mapy discgolfových hřišť a turnajů.">
<meta property="og:image" content="assets/og-roztyly-2026.jpg">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0b2450;
    --navy-2: #0a285c;
    --purple: #5d3884;
    --muted: #8591a7;
    --gold: #e8b93b;
    --card: rgba(255, 255, 255, .06);
    --card-line: rgba(255, 255, 255, .12);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--navy); }
  body { font-family: Inter, system-ui, -apple-system, 'Segoe UI', Arial, sans-serif; color: #fff;
         -webkit-font-smoothing: antialiased; }

  /* ---------- background: navy base, lighter wave, purple glow, basket watermark ---------- */
  .bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .bg svg.wave { position: absolute; inset: 0; width: 100%; height: 100%; }
  .bg .kos { position: absolute; top: -2vh; right: -14vw; height: 104vh; width: auto; min-height: 640px; }

  .wrap { position: relative; z-index: 1; max-width: 1400px; margin: 0 auto; padding: 0 clamp(16px, 4.2vw, 84px);
          min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
  main { flex: 1 0 auto; }

  /* ---------- header ---------- */
  header { padding: clamp(72px, 15vh, 170px) 0 clamp(40px, 7vh, 80px); }
  h1 { margin: 0; font-weight: 800; font-size: clamp(44px, 6.6vw, 92px); line-height: 1.02; letter-spacing: -.02em; }
  .by { margin: clamp(10px, 1.6vw, 22px) 0 0; font-weight: 700; font-size: clamp(20px, 2.3vw, 31px);
        color: var(--muted); letter-spacing: -.01em; }

  /* ---------- list ---------- */
  .list-head { display: flex; align-items: baseline; gap: 10px; margin: 0 0 16px;
               font-size: 13px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .list-head .count { display: inline-grid; place-items: center; min-width: 24px; height: 24px; padding: 0 7px;
                      border-radius: 999px; background: rgba(255,255,255,.1); color: #fff; letter-spacing: 0; font-size: 12px; }
  .maps { list-style: none; margin: 0; padding: 0 0 80px; display: grid; gap: 12px; max-width: 820px; }

  .card { display: grid; grid-template-columns: 136px 1fr auto; align-items: center; gap: 22px;
          padding: 12px 22px 12px 12px; border-radius: 20px; text-decoration: none; color: inherit;
          background: var(--card); border: 1px solid var(--card-line);
          -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
          transition: transform .2s ease, background .2s ease, border-color .2s ease, box-shadow .2s ease; }
  .card:hover, .card:focus-visible { transform: translateY(-3px); background: rgba(255,255,255,.09);
          border-color: rgba(232,185,59,.55); box-shadow: 0 18px 40px rgba(4, 12, 32, .45); outline: none; }
  .thumb { width: 136px; aspect-ratio: 1300 / 1080; border-radius: 11px; overflow: hidden; background: #d9d6c8;
           box-shadow: 0 6px 18px rgba(0,0,0,.3); }
  .thumb img { display: block; width: 100%; height: 100%; object-fit: cover; transition: transform .35s ease; }
  .card:hover .thumb img { transform: scale(1.04); }

  .eyebrow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 8px;
             font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); }
  .eyebrow .year { padding: 3px 9px; border-radius: 6px; background: var(--gold); color: #2a2006; letter-spacing: .04em; }
  .card h2 { margin: 0; font-size: clamp(21px, 2.2vw, 27px); font-weight: 800; letter-spacing: -.01em; line-height: 1.15; }
  .date { display: flex; align-items: center; gap: 7px; margin-top: 8px; font-size: 15px; font-weight: 600; color: #c4cbe0; }
  .date svg { width: 16px; height: 16px; opacity: .8; }
  .stats { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; padding: 0; list-style: none; }
  .stats li { padding: 5px 11px; border-radius: 999px; font-size: 13px; font-weight: 600; color: #e6e9f2;
              background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.1); }
  .stats b { font-weight: 800; color: #fff; }

  .go { display: grid; place-items: center; width: 48px; height: 48px; border-radius: 50%;
        background: rgba(255,255,255,.1); transition: background .2s, transform .2s; }
  .go svg { width: 20px; height: 20px; }
  .card:hover .go { background: var(--gold); transform: translateX(3px); }
  .card:hover .go svg { stroke: #2a2006; }

  footer { margin-top: auto; padding: 22px 0 26px; border-top: 1px solid rgba(255,255,255,.1);
           font-size: 13px; color: var(--muted); }

  @media (max-width: 640px) {
    .bg .kos { right: -55vw; height: 80vh; min-height: 0; top: 4vh; opacity: .9; }
    .card { grid-template-columns: 108px 1fr; gap: 14px; padding: 12px 14px 12px 12px; border-radius: 18px; }
    .thumb { width: 108px; border-radius: 10px; align-self: start; }
    .go { display: none; }
    .eyebrow { font-size: 10.5px; gap: 6px; margin-bottom: 6px; }
    .card h2 { font-size: 19px; }
    .date { font-size: 13.5px; margin-top: 6px; }
    .stats { gap: 6px; margin-top: 10px; }
    .stats li { padding: 4px 9px; font-size: 12px; }
  }
</style>
</head>
<body>

<div class="bg" aria-hidden="true">
  <svg class="wave" viewBox="0 0 2000 1125" preserveAspectRatio="xMidYMid slice">
    <defs>
      <linearGradient id="g-wave" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#0a285c"/>
        <stop offset=".45" stop-color="#1c2a66"/>
        <stop offset="1" stop-color="#3b3176"/>
      </linearGradient>
      <linearGradient id="g-base" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#0b2450"/>
        <stop offset=".55" stop-color="#0f2553"/>
        <stop offset="1" stop-color="#2a2c62"/>
      </linearGradient>
      <radialGradient id="g-glow" cx=".55" cy="1.02" r=".55">
        <stop offset="0" stop-color="#6b3a8e" stop-opacity=".95"/>
        <stop offset=".55" stop-color="#4a3480" stop-opacity=".45"/>
        <stop offset="1" stop-color="#3b3176" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <rect width="2000" height="1125" fill="url(#g-base)"/>
    <path d="M1010 0 C1060 160 1110 330 1085 440 C1060 560 990 630 820 700 C640 770 470 790 470 900
             C470 1010 560 1080 640 1125 L2000 1125 L2000 0 Z" fill="url(#g-wave)"/>
    <rect width="2000" height="1125" fill="url(#g-glow)"/>
  </svg>
  <img class="kos" src="assets/kos-watermark.svg" alt="">
</div>

<div class="wrap">
  <header>
    <h1>Discgolfové mapy</h1>
    <p class="by">by Kuba Kemr</p>
  </header>

  <main>
    <div class="list-head">Mapy <span class="count">2</span></div>
    <ul class="maps">

      <!-- ===== Jedna mapa = jeden blok <li>. Pro další mapu zkopíruj celý blok a uprav texty. ===== -->
      <li>
        <a class="card" href="roztyly-2026/">
          <div class="thumb"><img src="assets/roztyly-2026.jpg" alt="Náhled mapy PDGL #6 Roztyly" loading="lazy"></div>
          <div>
            <div class="eyebrow"><span class="year">2026</span> Pražská discgolfová liga</div>
            <h2>PDGL #6 – Roztyly</h2>
            <div class="date">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg>
              24. 10. 2026
            </div>
            <ul class="stats">
              <li><b>18</b> jamek</li>
              <li>Par <b>61</b></li>
              <li><b>1 596</b> m</li>
            </ul>
          </div>
          <span class="go" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </span>
        </a>
      </li>
      <!-- ===== konec bloku mapy ===== -->

      <li>
        <a class="card" href="smecno-2026/">
          <div class="thumb"><img src="assets/smecno-2026.jpg" alt="Náhled mapy PDGL #5 Smečno" loading="lazy"></div>
          <div>
            <div class="eyebrow"><span class="year">2026</span> Pražská discgolfová liga</div>
            <h2>PDGL #5 – Smečno</h2>
            <div class="date">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg>
              20. 9. 2026
            </div>
            <ul class="stats">
              <li><b>19</b> jamek</li>
              <li>Par <b>63</b></li>
              <li><b>2 040</b> m</li>
            </ul>
          </div>
          <span class="go" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </span>
        </a>
      </li>

    </ul>
  </main>

  <footer>© 2026 Kuba Kemr</footer>
</div>

</body>
</html>
